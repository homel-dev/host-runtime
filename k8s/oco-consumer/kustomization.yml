# k8s/oco-consumer/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: host-runtime

resources:
  - ../namespace.yml
  - configmap-datasource.yml
  - configmap-dashboard.yml
  - role.yml
  - rolebinding.yml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: host-runtime
