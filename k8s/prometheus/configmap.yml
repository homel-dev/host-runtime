# k8s/prometheus/configmap.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - prometheus.host-runtime.svc.cluster.local:9090
            labels:
              subsystem: host-runtime
              exporter: prometheus

      - job_name: node-exporter
        static_configs:
          - targets:
              - node-exporter.host-runtime.svc.cluster.local:9100
            labels:
              subsystem: host-runtime
              exporter: node

      - job_name: process-exporter
        static_configs:
          - targets:
              - process-exporter.host-runtime.svc.cluster.local:9256
            labels:
              subsystem: host-runtime
              exporter: process

      - job_name: minio
        scrape_interval: 60s
        metrics_path: /minio/metrics/v3
        static_configs:
          - targets:
              - minio.host-runtime.svc.cluster.local:9000
            labels:
              subsystem: host-runtime
              exporter: minio
