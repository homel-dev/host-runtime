# k8s/prometheus/service.yml
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics

spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: http
