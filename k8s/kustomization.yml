# k8s/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: host-runtime

resources:
  - namespace.yml


  - exporters/node/daemonset.yml
  - exporters/node/service.yml

  - exporters/process/configmap.yml
  - exporters/process/daemonset.yml
  - exporters/process/service.yml

  - minio/statefulset.yml
  - minio/service.yml
  - minio-consumers/networkpolicy.yml

  - oco-consumer/configmap-dashboard.yml
  - oco-consumer/role.yml
  - oco-consumer/rolebinding.yml

  - observability
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: host-runtime
