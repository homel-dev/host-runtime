# Taskfile.yml
version: "3"

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list

  validate:
    desc: Render Kubernetes and Flux manifests with Kustomize
    cmds:
      - kubectl kustomize k8s >/dev/null
      - kubectl kustomize k8s/minio >/dev/null
      - kubectl kustomize k8s/oco-consumer >/dev/null
      - kubectl kustomize clusters/minikube/apps >/dev/null
      - kubectl kustomize clusters/minikube >/dev/null

  deploy:
    desc: Refresh external bootstrap state and reconcile host-runtime through Flux
    cmds:
      - task: minio:bootstrap-secret
      - task: flux:reconcile-host-runtime


  flux:bootstrap:
    desc: One-time/idempotent Flux installation and GitOps bootstrap for Minikube
    cmds:
      - task: minio:bootstrap-secret
      - ./scripts/flux-bootstrap.sh

  flux:status:
    desc: Show Flux controllers, Git sources, reconciliations, and recent events
    cmds:
      - ./scripts/flux-status.sh

  flux:reconcile:
    desc: Request reconciliation of the host-runtime Git source and cluster control root
    cmds:
      - kubectl -n flux-system annotate gitrepository flux-system reconcile.fluxcd.io/requestedAt="$(date +%s)" --overwrite
      - kubectl -n flux-system annotate kustomization flux-system reconcile.fluxcd.io/requestedAt="$(date +%s)" --overwrite
      - kubectl -n flux-system wait --for=condition=Ready kustomization/flux-system --timeout=600s

  flux:reconcile-host-runtime:
    desc: Request Host Runtime reconciliation and wait for readiness
    cmds:
      - kubectl -n flux-system annotate gitrepository flux-system reconcile.fluxcd.io/requestedAt="$(date +%s)" --overwrite
      - kubectl -n flux-system annotate kustomization host-runtime reconcile.fluxcd.io/requestedAt="$(date +%s)" --overwrite
      - kubectl -n flux-system wait --for=condition=Ready kustomization/host-runtime --timeout=600s

  delete:
    desc: Delete host-runtime workloads/configuration while retaining namespace, data PVCs, and MinIO bootstrap Secret
    cmds:
      - >
        kubectl -n host-runtime delete
        deployment,daemonset,statefulset,service,configmap,role,rolebinding
        -l app.kubernetes.io/part-of=host-runtime --ignore-not-found

  purge:
    desc: Destructively delete the host-runtime namespace, including MinIO data and bootstrap credentials
    preconditions:
      - sh: test "${HOST_RUNTIME_PURGE:-}" = "YES"
        msg: "Destructive operation: set HOST_RUNTIME_PURGE=YES to delete the host-runtime namespace and all MinIO data"
    cmds:
      - kubectl delete namespace host-runtime --ignore-not-found

  status:
    desc: Show host-runtime resources
    cmds:
      - kubectl -n host-runtime get pods,ds,statefulset,deploy,svc,pvc,configmap,role,rolebinding

  events:
    desc: Show host-runtime namespace events
    cmds:
      - kubectl -n host-runtime get events --sort-by=.lastTimestamp

  logs-node-exporter:
    desc: Follow node-exporter logs from all pods
    cmds:
      - kubectl -n host-runtime logs ds/node-exporter -f

  logs-process-exporter:
    desc: Follow process-exporter logs from all pods
    cmds:
      - kubectl -n host-runtime logs ds/process-exporter -f

  node-metrics:
    desc: Fetch node-exporter metrics through cluster DNS
    cmds:
      - >
        kubectl -n host-runtime run host-runtime-curl-node
        --rm -i --restart=Never --image=curlimages/curl:8.10.1 --quiet
        --command -- curl -fsS http://node-exporter.host-runtime.svc.cluster.local:9100/metrics

  process-metrics:
    desc: Fetch process-exporter metrics through cluster DNS
    cmds:
      - >
        kubectl -n host-runtime run host-runtime-curl-process
        --rm -i --restart=Never --image=curlimages/curl:8.10.1 --quiet
        --command -- curl -fsS http://process-exporter.host-runtime.svc.cluster.local:9256/metrics

  minio:init:
    desc: Create local minio.env from minio.env.example if it does not exist
    cmds:
      - |
        if [ ! -f minio.env ]; then
          cp minio.env.example minio.env
          printf '%s\n' "Created local minio.env from minio.env.example"
        fi

  minio:bootstrap-secret:
    desc: Create or update the MinIO bootstrap Secret from local minio.env
    cmds:
      - task: minio:init
      - |
        set -eu
        set -a
        . ./minio.env
        set +a

        : "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in minio.env}"
        : "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in minio.env}"
        : "${MINIO_LICENSE_FILE:?MINIO_LICENSE_FILE is required in minio.env}"

        if [ ! -f "$MINIO_LICENSE_FILE" ]; then
          printf '%s\n' "MinIO license file not found: $MINIO_LICENSE_FILE" >&2
          printf '%s\n' "Place the AIStor license at that path or edit MINIO_LICENSE_FILE in minio.env." >&2
          exit 1
        fi

        kubectl get namespace host-runtime >/dev/null 2>&1 || kubectl create namespace host-runtime
        kubectl -n host-runtime create secret generic minio-bootstrap \
          --from-literal=root-user="$MINIO_ROOT_USER" \
          --from-literal=root-password="$MINIO_ROOT_PASSWORD" \
          --from-file=minio.license="$MINIO_LICENSE_FILE" \
          --dry-run=client -o yaml | kubectl apply -f -

  minio:start:
    desc: Start MinIO using local minio.env, retaining existing object data
    cmds:
      - task: minio:bootstrap-secret
      - kubectl apply -k k8s/minio
      - kubectl apply -f k8s/minio-consumers/networkpolicy.yml
      - kubectl -n host-runtime rollout status statefulset/minio --timeout=180s
      - task: minio:status

  minio:stop:
    desc: Stop MinIO while retaining its PVC and bootstrap Secret
    cmds:
      - |
        if kubectl get namespace host-runtime >/dev/null 2>&1; then
          kubectl delete -k k8s/minio --ignore-not-found
        else
          printf '%s\n' "MinIO is not deployed; namespace host-runtime does not exist."
        fi

  minio:restart:
    desc: Restart MinIO, or start it if it is not currently deployed
    cmds:
      - task: minio:bootstrap-secret
      - |
        if kubectl -n host-runtime get statefulset/minio >/dev/null 2>&1; then
          kubectl -n host-runtime rollout restart statefulset/minio
        else
          kubectl apply -k k8s/minio
        fi
      - kubectl apply -f k8s/minio-consumers/networkpolicy.yml
      - kubectl -n host-runtime rollout status statefulset/minio --timeout=180s
      - task: minio:status

  minio:status:
    desc: Show MinIO StatefulSet, pod, services, and persistent volume claim
    cmds:
      - kubectl -n host-runtime get statefulset/minio
      - kubectl -n host-runtime get pod -l app.kubernetes.io/name=minio
      - kubectl -n host-runtime get svc/minio-headless svc/minio svc/minio-console
      - kubectl -n host-runtime get pvc -l app.kubernetes.io/name=minio

  minio:logs:
    desc: Follow MinIO logs
    cmds:
      - kubectl -n host-runtime logs statefulset/minio -f

  minio:console:
    desc: Port-forward the MinIO Console to localhost:9001
    cmds:
      - kubectl -n host-runtime port-forward svc/minio-console 9001:9001

  minio:api:
    desc: Port-forward the MinIO S3 API to localhost:9000
    cmds:
      - kubectl -n host-runtime port-forward svc/minio 9000:9000

  minio:rr-artifacts:
    desc: Provision the rr-artifacts bucket, scoped RR writer/OCO reader credentials, and MinIO consumer NetworkPolicy
    cmds:
      - |
        set -eu
        kubectl -n host-runtime rollout status statefulset/minio --timeout=180s
        kubectl get namespace rr >/dev/null
        kubectl get namespace observability-console >/dev/null
        kubectl apply -f k8s/minio-consumers/networkpolicy.yml

        writer_access=rr-artifacts-writer
        writer_secret=""
        if kubectl -n rr get secret rr-artifact-store >/dev/null 2>&1; then
          existing_access="$(kubectl -n rr get secret rr-artifact-store -o jsonpath='{.data.RR_ARTIFACT_STORE_ACCESS_KEY}' | base64 -d 2>/dev/null || true)"
          existing_secret="$(kubectl -n rr get secret rr-artifact-store -o jsonpath='{.data.RR_ARTIFACT_STORE_SECRET_KEY}' | base64 -d 2>/dev/null || true)"
          if [ -n "$existing_access" ] && [ -n "$existing_secret" ]; then
            writer_access="$existing_access"
            writer_secret="$existing_secret"
          fi
        fi
        if [ -z "$writer_secret" ]; then writer_secret="$(openssl rand -hex 32)"; fi

        reader_access=oco-artifacts-reader
        reader_secret=""
        if kubectl -n observability-console get secret oco-artifact-store >/dev/null 2>&1; then
          existing_access="$(kubectl -n observability-console get secret oco-artifact-store -o jsonpath='{.data.OCO_ARTIFACT_STORE_ACCESS_KEY}' | base64 -d 2>/dev/null || true)"
          existing_secret="$(kubectl -n observability-console get secret oco-artifact-store -o jsonpath='{.data.OCO_ARTIFACT_STORE_SECRET_KEY}' | base64 -d 2>/dev/null || true)"
          if [ -n "$existing_access" ] && [ -n "$existing_secret" ]; then
            reader_access="$existing_access"
            reader_secret="$existing_secret"
          fi
        fi
        if [ -z "$reader_secret" ]; then reader_secret="$(openssl rand -hex 32)"; fi

        kubectl -n host-runtime create secret generic rr-artifact-provision \
          --from-literal=writer-access-key="$writer_access" \
          --from-literal=writer-secret-key="$writer_secret" \
          --from-literal=reader-access-key="$reader_access" \
          --from-literal=reader-secret-key="$reader_secret" \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n host-runtime delete job minio-rr-artifacts-provision --ignore-not-found --wait=true >/dev/null
        kubectl apply -f k8s/minio-consumers/provision-job.yml
        if ! kubectl -n host-runtime wait --for=condition=complete job/minio-rr-artifacts-provision --timeout=120s; then
          kubectl -n host-runtime logs job/minio-rr-artifacts-provision || true
          kubectl -n host-runtime delete secret rr-artifact-provision --ignore-not-found >/dev/null
          exit 1
        fi

        kubectl -n rr create secret generic rr-artifact-store \
          --from-literal=RR_ARTIFACT_STORE_ENDPOINT=http://minio.host-runtime.svc.cluster.local:9000 \
          --from-literal=RR_ARTIFACT_STORE_BUCKET=rr-artifacts \
          --from-literal=RR_ARTIFACT_STORE_ACCESS_KEY="$writer_access" \
          --from-literal=RR_ARTIFACT_STORE_SECRET_KEY="$writer_secret" \
          --dry-run=client -o yaml | kubectl apply -f -

        kubectl -n observability-console create secret generic oco-artifact-store \
          --from-literal=OCO_ARTIFACT_STORE_ENDPOINT=http://minio.host-runtime.svc.cluster.local:9000 \
          --from-literal=OCO_ARTIFACT_STORE_BUCKET=rr-artifacts \
          --from-literal=OCO_ARTIFACT_STORE_ACCESS_KEY="$reader_access" \
          --from-literal=OCO_ARTIFACT_STORE_SECRET_KEY="$reader_secret" \
          --dry-run=client -o yaml | kubectl apply -f -

        kubectl -n host-runtime delete secret rr-artifact-provision --ignore-not-found >/dev/null
        kubectl -n host-runtime delete job minio-rr-artifacts-provision --ignore-not-found --wait=false >/dev/null
        printf '%s\n' "RR artifact store ready: s3://rr-artifacts/runs/<run-id>/"

  minio:rr-artifacts-status:
    desc: Show RR artifact bucket wiring without printing credentials
    cmds:
      - kubectl get -f k8s/minio-consumers/networkpolicy.yml
      - kubectl -n rr get secret rr-artifact-store -o jsonpath='{.metadata.name}{"\n"}'
      - kubectl -n observability-console get secret oco-artifact-store -o jsonpath='{.metadata.name}{"\n"}'

  oco-contract:
    desc: Apply only OCO consumer ConfigMaps and RBAC in host-runtime namespace
    cmds:
      - kubectl apply -k k8s/oco-consumer

  oco-status:
    desc: Show OCO consumer contract resources in host-runtime namespace
    cmds:
      - kubectl -n host-runtime get configmap,role,rolebinding

  logs-alloy:
    desc: Follow namespace-local Alloy logs
    cmds:
      - kubectl -n host-runtime logs daemonset/alloy -f --tail=200
