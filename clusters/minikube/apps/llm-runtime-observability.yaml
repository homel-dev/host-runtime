apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-runtime-observability
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  path: ./k8s/observability
  prune: true
  wait: true
  dependsOn:
    - name: llm-runtime-namespace
  sourceRef:
    kind: GitRepository
    name: llm-runtime
