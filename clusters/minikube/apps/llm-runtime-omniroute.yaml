apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-runtime-omniroute
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./k8s/gitops/omniroute
  prune: false
  wait: true
  dependsOn:
    - name: llm-runtime-namespace
  sourceRef:
    kind: GitRepository
    name: llm-runtime
