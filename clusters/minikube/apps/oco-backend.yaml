apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oco-backend
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./k8s/backend
  # Initial adoption: retain existing PVCs, telemetry and backend resources.
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: oco
    namespace: flux-system
