apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: memory-steward-codegraph
  namespace: flux-system
spec:
  type: generic
  address: http://codegraph-controller.ms.svc.cluster.local:8093/events/flux
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: relentless-rekrow-codegraph
  namespace: flux-system
spec:
  providerRef:
    name: memory-steward-codegraph
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: relentless-rekrow
      namespace: flux-system
