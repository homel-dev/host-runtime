apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memory-steward-restore
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 35m
  path: ./k8s/restore
  prune: true
  wait: true
  dependsOn:
    - name: memory-steward-infra
  sourceRef:
    kind: GitRepository
    name: memory-steward
    namespace: flux-system
