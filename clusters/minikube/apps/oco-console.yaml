apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oco-console
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./k8s
  # Initial adoption: never prune manually managed Grafana credentials/state.
  prune: false
  wait: true
  dependsOn:
    - name: oco-backend
  sourceRef:
    kind: GitRepository
    name: oco
    namespace: flux-system
