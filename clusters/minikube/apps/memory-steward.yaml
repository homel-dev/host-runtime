apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memory-steward
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./k8s
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: memory-steward
    namespace: flux-system
