apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memory-steward
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./k8s
  # Formerly owned database/PVC resources must NOT be deleted during the
  # transition to the dedicated memory-steward-infra Kustomization.
  prune: false
  wait: true
  dependsOn:
    - name: memory-steward-migrate
  sourceRef:
    kind: GitRepository
    name: memory-steward
    namespace: flux-system
