- op: replace
  path: /spec/template/spec/containers/0/imagePullPolicy
  value: Always
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --artifact-mirror-config=/etc/source-controller/artifact-mirror/config.json
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: artifact-mirror-config
    mountPath: /etc/source-controller/artifact-mirror
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: artifact-mirror-config
    secret:
      secretName: source-controller-artifact-mirror
