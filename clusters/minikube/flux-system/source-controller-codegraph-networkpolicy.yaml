apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: source-controller-codegraph-artifacts
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ms
          podSelector:
            matchLabels:
              app: codegraph-worker
      ports:
        - protocol: TCP
          port: 9090
